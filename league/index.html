<!doctype html>
<!--
  SEA OF COLOURS · KNOCKOUT LEAGUE — the live page
  ═════════════════════════════════════════════════════════════════════

  The bracket, as it actually stands, with every replay one click away.

  Its frozen twin is announce.html beside it, which bakes its data in
  so it can be dropped into Slack. This one is the opposite: source
  here, data in reports/league/league.js, regenerated by
  `soc cup site`. Served at /league/ by server/app.py.

  ONE RULE, and it is the same one the battle room has: this page is
  also opened over file:// (an organiser checking a bracket on a
  laptop with no server). So the data arrives via a <script> tag that
  registers window.SOC_LEAGUE — never a fetch(), which cannot work
  from file://. If league.js is missing the page says so plainly
  rather than rendering an empty bracket that looks like a league
  nobody has played.

  THE MAIN VIEW STAYS CLEAN. Sixteen ties, names and scorelines, and
  nothing else. Everything deeper — the three seasons, the weapons,
  the attrition, the replay links — lives in a popover that opens on
  hover and pins on click. That split is deliberate: a bracket you
  have to read carefully is a bracket nobody reads.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sea of Colours · Knockout League</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=VT323&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0d12;
    --raise: #131319;
    --raise2: #16161d;
    --fg: #f0f6fc;
    --dim: #a8b1bd;
    --frame: #4a4a5a;
    --soft: #2a2a35;

    --green: #4dca5e;
    --red: #ff8585;
    --blue: #7ab8ff;
    --amber: #ffc857;

    --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo,
            ui-monospace, monospace;
    --retro: 'VT323', 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 0 120px;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1380px; margin: 0 auto; padding: 0 26px; }
  .dim { color: var(--dim); }
  .amber { color: var(--amber); }
  .green { color: var(--green); }
  .red { color: var(--red); }
  b, strong { font-weight: 500; }
  code {
    background: var(--raise2); border: 1px solid var(--soft);
    border-radius: 2px; padding: 0 4px; font-size: .92em;
  }

  /* ══ head ═══════════════════════════════════════════════════════ */

  .hero {
    border-bottom: 1px solid var(--soft);
    padding: 34px 0 26px;
    background:
      radial-gradient(900px 240px at 16% -40%, rgba(122,184,255,.12), transparent 70%),
      radial-gradient(700px 220px at 84% -30%, rgba(255,133,133,.09), transparent 70%);
  }
  .kicker {
    color: var(--dim); letter-spacing: .3em;
    text-transform: uppercase; font-size: 10px;
  }
  h1 {
    font-family: var(--retro); font-size: 54px; line-height: .95;
    margin: 12px 0 0; font-weight: 400;
  }
  h1 .sub { color: var(--amber); }
  .headrow {
    display: flex; gap: 26px; align-items: flex-end;
    flex-wrap: wrap; justify-content: space-between;
  }
  .gen { color: var(--frame); font-size: 10.5px; letter-spacing: .1em; }
  .nav { display: flex; gap: 14px; font-size: 11px; }
  .nav a {
    border: 1px solid var(--soft); border-radius: 2px;
    padding: 4px 10px; color: var(--dim);
    letter-spacing: .12em; text-transform: uppercase;
  }
  .nav a:hover { color: var(--fg); border-color: var(--frame); text-decoration: none; }

  h2 {
    font-size: 11.5px; font-weight: 500; letter-spacing: .24em;
    text-transform: uppercase; color: var(--dim);
    border-bottom: 1px solid var(--soft);
    padding-bottom: 9px; margin: 44px 0 20px;
  }
  h2 .count { color: var(--frame); margin-left: 8px; letter-spacing: .1em; }

  /* ══ health banner ══════════════════════════════════════════════
     The loudest thing on the page when it matters. A season where
     every model call failed still produces a winner, played by the
     built-in heuristic — and nothing about that *looks* wrong. */

  .warn {
    border: 1px solid var(--amber);
    border-left-width: 3px;
    background: rgba(255,200,87,.06);
    padding: 11px 15px; margin: 22px 0 0;
    font-size: 12.5px;
  }
  .warn.bad { border-color: var(--red); background: rgba(255,133,133,.06); }
  .warn .t {
    font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--amber); margin-bottom: 4px;
  }
  .warn.bad .t { color: var(--red); }

  .missing {
    border: 1px dashed var(--frame); border-radius: 3px;
    padding: 28px; margin: 34px 0; color: var(--dim);
    text-align: center;
  }

  /* ══ figures ════════════════════════════════════════════════════ */

  .figures {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 1px; background: var(--soft);
    border: 1px solid var(--soft); margin: 26px 0 0;
  }
  .fig { background: var(--raise); padding: 13px 15px; }
  .fig .n { font-family: var(--retro); font-size: 34px; line-height: .9; }
  .fig .k {
    color: var(--dim); font-size: 9px; letter-spacing: .15em;
    text-transform: uppercase; margin-top: 6px;
  }

  /* ══ bracket ════════════════════════════════════════════════════ */

  .bracket {
    display: flex; align-items: stretch;
    overflow-x: auto; padding: 4px 0 14px;
  }
  .rnd { display: flex; flex-direction: column; min-width: 224px; flex: 1; }
  .rh {
    color: var(--dim); font-size: 9.5px; letter-spacing: .18em;
    text-transform: uppercase; padding: 0 0 12px 2px; white-space: nowrap;
  }
  .rh i { color: var(--frame); font-style: normal; }
  .cell {
    flex: 1; display: flex; align-items: center;
    padding-right: 20px; position: relative;
    margin-bottom: 5px;
  }
  /* Children are the .rh header then the cells, so the wider gap on
     odd children separates the two ties feeding the next round. */
  .cell:nth-child(odd) { margin-bottom: 15px; }
  .cell::before {
    content: ""; position: absolute; right: 10px; top: 50%;
    width: 10px; border-top: 1px solid var(--soft);
  }
  .rnd.last .cell::before { display: none; }

  .tie {
    width: 100%; border: 1px solid var(--soft);
    background: var(--raise); border-radius: 2px;
    overflow: hidden; cursor: pointer;
    transition: border-color .12s;
  }
  .tie:hover, .tie.pinned { border-color: var(--frame); }
  .tie.pinned { box-shadow: 0 0 0 1px var(--frame); }
  .tie.live { border-left: 2px solid var(--amber); }
  .tie .s {
    padding: 5px 9px; font-size: 11px; display: flex;
    gap: 7px; align-items: baseline;
  }
  .tie .s + .s { border-top: 1px solid var(--soft); }
  .tie .s .n { color: var(--frame); min-width: 18px; flex: none; }
  .tie .s .nm {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tie .s .g { color: var(--frame); font-variant-numeric: tabular-nums; flex: none; }
  .tie .s.won .nm { color: var(--green); }
  .tie .s.won .g { color: var(--green); }
  .tie .s.lost .nm { color: var(--dim); }
  .tie .s.tbd { color: var(--frame); }
  .tie .foot {
    background: var(--raise2); border-top: 1px solid var(--soft);
    padding: 2px 9px; font-size: 9px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--frame);
    display: flex; justify-content: space-between; gap: 8px;
  }
  .cup {
    align-self: center; border: 1px solid var(--amber);
    background: rgba(255,200,87,.07); color: var(--amber);
    padding: 12px 16px; border-radius: 2px; white-space: nowrap;
    text-align: center;
  }
  .cup .star { font-family: var(--retro); font-size: 26px; line-height: 1; }
  .cup .who { font-size: 11px; margin-top: 4px; }

  /* ══ popover ════════════════════════════════════════════════════ */

  #pop {
    position: absolute; z-index: 40; width: 460px; max-width: 94vw;
    border: 1px solid var(--frame); background: var(--raise);
    border-radius: 3px; box-shadow: 0 18px 44px rgba(0,0,0,.6);
    display: none;
  }
  #pop.on { display: block; }
  #pop .ph {
    background: var(--raise2); border-bottom: 1px solid var(--soft);
    padding: 9px 13px; display: flex; justify-content: space-between;
    gap: 10px; align-items: baseline;
  }
  #pop .ph .st {
    font-size: 9.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--dim);
  }
  #pop .ph .x {
    color: var(--frame); cursor: pointer; font-size: 14px;
    line-height: 1; padding: 0 2px;
  }
  #pop .ph .x:hover { color: var(--fg); }
  #pop .pb { padding: 12px 13px 13px; }
  #pop .vs { font-size: 13px; margin-bottom: 3px; }
  #pop .vs .w { color: var(--green); }
  #pop .how { color: var(--dim); font-size: 11px; }

  table.g { border-collapse: collapse; width: 100%; margin-top: 11px; font-size: 11px; }
  table.g th {
    text-align: left; font-weight: 400; color: var(--frame);
    font-size: 9px; letter-spacing: .13em; text-transform: uppercase;
    border-bottom: 1px solid var(--soft); padding: 0 6px 4px 0;
  }
  table.g td {
    padding: 4px 6px 4px 0; border-bottom: 1px solid var(--soft);
    font-variant-numeric: tabular-nums;
  }
  table.g tr:last-child td { border-bottom: none; }
  table.g td.w { color: var(--green); }

  .lines { margin-top: 12px; }
  .line {
    display: flex; gap: 10px; padding: 4px 0;
    border-top: 1px solid var(--soft); font-size: 11px;
  }
  .line .k {
    color: var(--frame); font-size: 9px; letter-spacing: .13em;
    text-transform: uppercase; min-width: 104px; padding-top: 2px; flex: none;
  }
  .line .v { flex: 1; display: flex; flex-wrap: wrap; gap: 5px; }
  .line .v.plain { display: block; color: var(--dim); }
  .chip {
    font-size: 9.5px; letter-spacing: .08em;
    border: 1px solid var(--frame); border-radius: 2px;
    padding: 1px 6px; white-space: nowrap; color: var(--dim);
  }
  .chip.snap  { border-color: var(--red);   color: var(--red); }
  .chip.emp   { border-color: var(--blue);  color: var(--blue); }
  .chip.chaff { border-color: var(--amber); color: var(--amber); }
  .chip.cold  { border-style: dashed; }
  .chip.kill  { border-color: var(--green); color: var(--green); }

  /* ══ per-agent table ════════════════════════════════════════════ */

  table.run { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  table.run th {
    text-align: left; font-weight: 400; color: var(--frame);
    font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
    border-bottom: 1px solid var(--soft); padding: 0 9px 5px 0;
    white-space: nowrap;
  }
  table.run td {
    padding: 5px 9px 5px 0; border-bottom: 1px solid var(--soft);
    font-variant-numeric: tabular-nums;
  }
  table.run td.nm { max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
  table.run tr:hover td { background: var(--raise); }
  .seedn { color: var(--frame); }

  @media (max-width: 720px) {
    h1 { font-size: 38px; }
    .wrap { padding: 0 15px; }
    #pop { width: 94vw; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap headrow">
    <div>
      <div class="kicker">Snowflake &middot; Sea of Colours</div>
      <h1>Knockout <span class="sub">League</span></h1>
    </div>
    <div>
      <div class="nav">
        <a href="./announce.html">Shareable card</a>
        <a href="../guide/index.html">Guide</a>
        <a href="../guide/weapons.html">Weapons</a>
      </div>
      <div class="gen" id="gen"></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="body"></div>
</div>

<div id="pop"></div>

<!-- Generated by `soc cup site`. A <script> tag rather than a fetch, so
     the page also works when opened straight off disk.

     Two tags, because the file sits in a different place depending on
     how you got here. Under the server it is /league/league.js (the
     mount maps reports/league/ onto the same prefix as this page);
     off disk this file is league/index.html and the data is a
     directory away. Both tags are harmless when they miss — a script
     that 404s just fires onerror — and they load the same generated
     file, so whichever wins, the page draws the same league. This is
     also why it is not a fetch(): that cannot work from file:// at
     all, and an organiser checking a bracket mid-restart is exactly
     who needs it to. -->
<script src="./league.js" onerror="window.SOC_LEAGUE_MISS = 1"></script>
<script src="../reports/league/league.js" onerror="window.SOC_LEAGUE_MISS = 1"></script>
<script>
(function () {
  "use strict";

  const D = window.SOC_LEAGUE || null;
  const body = document.getElementById("body");
  const pop = document.getElementById("pop");

  /* ── no data ──────────────────────────────────────────────────── */

  if (!D) {
    body.innerHTML = `
      <div class="missing">
        <div style="font-size:15px;color:var(--fg)">No league data yet.</div>
        <p>This page draws <code>reports/league/league.js</code>, which
           <code>soc cup site</code> writes. Nothing has been generated
           here, so there is nothing to show &mdash; which is different
           from a league nobody has won.</p>
        <p class="dim">Build the field, play a round, publish it:</p>
        <p><code>soc cup roster --cutoff &lt;iso&gt;</code> &middot;
           <code>soc cup run --jobs 4</code> &middot;
           <code>soc cup site</code></p>
      </div>`;
    return;
  }

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const short = (s, n) => (s.length > n ? s.slice(0, n - 1) + "\u2026" : s);
  const num = (n) => (n == null ? "\u2014" : n);
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;

  /* Challengers go in the same lookup as bracket ties, so the popover
     works on one without knowing it is not in the bracket. They are kept
     out of D.matches itself so the figures and the health banner keep
     describing the cup and not the cup plus its sideshows. */
  const byId = {};
  (D.matches || []).forEach((m) => { byId[m.id] = m; });
  (D.challengers || []).forEach((m) => { byId[m.id] = m; });

  const seedOf = {};
  ((D.roster || {}).entrants || []).forEach((e, i) => { seedOf[e.label] = i + 1; });

  const teamOf = {};
  ((D.roster || {}).entrants || []).forEach((e) => { teamOf[e.label] = e.team || ""; });

  const weaponsOf = {};
  (D.weapons || []).forEach((w) => { weaponsOf[w.agent] = w; });

  /* ── header ───────────────────────────────────────────────────── */

  document.getElementById("gen").textContent =
    "Generated " + (D.generated || "").replace("T", " ").slice(0, 16);

  /* ── health, first and loud ───────────────────────────────────── */

  const h = D.health || {};
  let warn = "";
  if (h.games_with_fallback) {
    warn += `
      <div class="warn">
        <div class="t">Read these results carefully</div>
        ${plural(h.games_with_fallback, "season")} contain
        ${plural(h.fallback_turns, "turn")} played by the built-in
        heuristic rather than the agent, because a model call failed.
        A fallen-back season still produces a score and a winner, and
        nothing about it looks wrong &mdash; which is why it is said
        here rather than buried.
      </div>`;
  }
  if (h.errored) {
    warn += `
      <div class="warn bad">
        <div class="t">Incomplete</div>
        ${plural(h.errored, "season")} errored or aborted. The matches
        holding them are not decided, and the bracket stops there
        rather than advancing a result nobody played.
      </div>`;
  }

  /* ── figures ──────────────────────────────────────────────────── */

  const fired = (D.weapons || []).reduce((a, w) => a + (w.fired_total || 0), 0);
  const unfired = (D.weapons || []).reduce((a, w) => a + (w.unfired || 0), 0);
  const kills = (D.weapons || []).reduce((a, w) => a + (w.kills_total || 0), 0);
  const played = (D.matches || []).filter((m) => m.complete).length;
  const total = ((D.format || {}).bracket_size || 0) - 1
              + ((D.format || {}).play_ins || 0);

  const figures = `
    <div class="figures">
      <div class="fig"><div class="n">${played}<span class="dim" style="font-size:16px">/${total}</span></div>
        <div class="k">matches played</div></div>
      <div class="fig"><div class="n">${h.games || 0}</div><div class="k">seasons</div></div>
      <div class="fig"><div class="n">${fired}</div><div class="k">weapons fired</div></div>
      <div class="fig"><div class="n">${unfired}</div><div class="k">bought, unfired</div></div>
      <div class="fig"><div class="n">${kills}</div><div class="k">kills</div></div>
      <div class="fig"><div class="n">${((D.roster||{}).entrants||[]).length}</div>
        <div class="k">entrants</div></div>
    </div>`;

  /* ── the bracket ──────────────────────────────────────────────── */

  function sideRow(name, seed, tie, which) {
    if (!name) {
      return `<div class="s tbd"><span class="n"></span>
                <span class="nm">to be decided</span></div>`;
    }
    const m = byId[tie.id];
    const wins = m ? (which === "a" ? m.scoreline : (m.scoreline || "")
                        .split("-").reverse().join("-")) : "";
    const w = m && m.winner === name;
    const l = m && m.complete && m.winner && m.winner !== name;
    const cls = w ? " won" : (l ? " lost" : "");
    const g = m && m.complete ? (wins.split("-")[0] || "") : "";
    return `<div class="s${cls}">
        <span class="n">${seed || ""}</span>
        <span class="nm" title="${esc(name)}">${esc(short(name, 26))}</span>
        <span class="g">${g}</span>
      </div>`;
  }

  const bracket = (D.bracket || []).map((rnd, ri, arr) => {
    const cells = (rnd.ties || []).map((t) => {
      const m = byId[t.id];
      const live = m && !m.complete && (m.games || []).length;
      const foot = m && m.complete
        ? `<div class="foot"><span>${esc(m.decided_by)}</span>
             <span>${m.margin > 0 ? "+" : ""}${m.margin}</span></div>`
        : (live
            ? `<div class="foot"><span>in progress</span>
                 <span>${(m.games || []).length}/3</span></div>`
            : "");
      return `<div class="cell">
          <div class="tie${live ? " live" : ""}" data-tie="${esc(t.id)}"
               data-stage="${esc(rnd.label)}">
            ${sideRow(t.a, t.seed_a, t, "a")}
            ${sideRow(t.b, t.seed_b, t, "b")}
            ${foot}
          </div>
        </div>`;
    }).join("");
    const last = ri === arr.length - 1 ? " last" : "";
    return `<div class="rnd${last}">
        <div class="rh">${esc(rnd.label)}
          <i>&middot; ${plural((rnd.ties || []).length, "match", "matches")}</i></div>
        ${cells}
      </div>`;
  }).join("");

  const cupBox = `
    <div class="rnd last" style="min-width:160px;justify-content:center">
      <div class="rh">Champion</div>
      <div class="cup">
        <div class="star">&#9733;</div>
        <div class="who">${D.champion
          ? esc(short(D.champion, 20)) : '<span class="dim">undecided</span>'}</div>
      </div>
    </div>`;

  /* ── how far each agent got ───────────────────────────────────── */

  const runs = (D.progress || []).filter((p) => p.played).map((p) => {
    const w = weaponsOf[p.agent] || {};
    const where = p.out_at
      ? `out at ${esc(((D.format || {}).stage_labels || {})[p.out_at] || p.out_at)}`
      : (D.champion === p.agent ? "<b class='amber'>champion</b>" : "through");
    return `<tr>
        <td class="seedn">${p.seed}</td>
        <td class="nm" title="${esc(p.agent)}">${esc(p.agent)}</td>
        <td class="dim">${esc(teamOf[p.agent] || "")}</td>
        <td>${p.won}&ndash;${p.lost}</td>
        <td>${p.season_wins}&ndash;${p.season_losses}${
             p.season_draws ? "&ndash;" + p.season_draws : ""}</td>
        <td>${p.margin > 0 ? "+" : ""}${p.margin}</td>
        <td>${w.fired_total || 0}</td>
        <td class="${w.unfired ? "amber" : "dim"}">${w.unfired || 0}</td>
        <td>${w.kills_total || 0}</td>
        <td class="${p.fallback_turns ? "amber" : "dim"}">${p.fallback_turns || 0}</td>
        <td class="dim">${where}</td>
      </tr>`;
  }).join("");

  const runsTable = runs ? `
    <table class="run">
      <thead><tr>
        <th>#</th><th>Agent</th><th>Team</th><th>Ties</th><th>Seasons</th>
        <th>Margin</th><th>Fired</th><th>Unfired</th><th>Kills</th>
        <th>Fallback</th><th></th>
      </tr></thead>
      <tbody>${runs}</tbody>
    </table>`
    : `<p class="dim">Nothing played yet.</p>`;

  /* ── assemble ─────────────────────────────────────────────────── */

  /* ── late entries, beside the bracket ─────────────────────────── */

  const chalTies = (D.challengers || []).map((m) => {
    const live = !m.complete && (m.games || []).length;
    const foot = m.complete
      ? `<div class="foot"><span>${esc(m.decided_by)}</span>
           <span>${m.margin > 0 ? "+" : ""}${m.margin}</span></div>`
      : `<div class="foot"><span>${live ? "in progress" : "not started"}</span>
           <span>${(m.games || []).length}/3</span></div>`;
    const t = { id: m.id, a: m.a, b: m.b };
    return `<div class="cell" style="max-width:300px">
        <div class="tie${live ? " live" : ""}" data-tie="${esc(m.id)}"
             data-stage="Challenger">
          ${sideRow(m.a, "", t, "a")}
          ${sideRow(m.b, "", t, "b")}
          ${foot}
        </div>
      </div>`;
  }).join("");

  const chalSection = chalTies ? `
    <h2>Late entry <span class="count">beside the bracket, not in it</span></h2>
    <p class="dim" style="margin:-8px 0 16px;max-width:86ch">
      ${esc((D.challengers.find((c) => c.note) || {}).note
            || "A challenger for a qualifier's slot.")}
    </p>
    <div class="bracket">${chalTies}</div>` : "";

  body.innerHTML = warn + figures
    + `<h2>The bracket <span class="count">hover a tie, click to pin</span></h2>`
    + `<div class="bracket">${bracket}${cupBox}</div>`
    + chalSection
    + `<h2>How far each agent got</h2>` + runsTable;

  /* ── the popover ──────────────────────────────────────────────── */

  const REPLAY = (D.format || {}).replay_url || "/play?session=";
  let pinned = null;

  /* How long a match at this stage is, read from the data rather than
     written in prose. The final is best-of-seven and every other round
     best-of-three, so a single hardcoded sentence is wrong on exactly
     the one match most people will open. */
  const WORDS = ["", "one", "two", "three", "four", "five", "six", "seven"];
  function formatOf(stage) {
    const f = D.format || {};
    const key = Object.keys((f.stage_labels || {}))
      .find((s) => (f.stage_labels[s] || "").toLowerCase() === String(stage).toLowerCase());
    const bo = ((f.best_of_by_stage || {})[key]) || f.best_of || 3;
    const need = ((f.wins_needed_by_stage || {})[key]) || (Math.floor(bo / 2) + 1);
    return `${WORDS[bo] || bo} seasons, sides swapping, first to ${
      WORDS[need] || need} wins`;
  }

  /* Totals for one agent across a whole tie.

     Per-game would be three chips reading "CHAFF x1 cold" in a row,
     which is how you turn "bought a rack and never used it" into
     something a reader skims past. The tie is the unit the popover is
     about, so the numbers are too. */
  function seatTotals(agent, games) {
    const fired = {}, bought = {}, kills = {};
    (games || []).forEach((g) => {
      const s = (g.stats || {})[g.p1 === agent ? "p1" : "p2"] || {};
      Object.entries(s.fired || {}).forEach(([k, n]) => {
        fired[k] = (fired[k] || 0) + (n || 0);
      });
      Object.entries(s.bought || {}).forEach(([k, n]) => {
        bought[k] = (bought[k] || 0) + (n || 0);
      });
      Object.entries(s.kills || {}).forEach(([k, victims]) => {
        kills[k] = (kills[k] || 0)
          + Object.values(victims || {}).reduce((a, b) => a + (b || 0), 0);
      });
    });
    return { fired, bought, kills };
  }

  /* Fired first, then what was bought and never fired. Both on one
     line under one honest label: "fired" over a cold chip would be a
     caption contradicting its own contents. */
  function ordnanceChips(t) {
    const out = [];
    Object.entries(t.fired).forEach(([k, n]) => {
      if (n > 0) out.push(`<span class="chip ${k}">${k.toUpperCase()} &times;${n}</span>`);
    });
    Object.entries(t.bought).forEach(([k, n]) => {
      const cold = n - (t.fired[k] || 0);
      if (cold > 0) {
        out.push(`<span class="chip ${k} cold" title="bought and never fired"
                  >${k.toUpperCase()} &times;${cold} cold</span>`);
      }
    });
    return out.join("");
  }

  function killChips(t) {
    const labels = (D.format || {}).kill_labels || {};
    return Object.entries(t.kills)
      .filter(([, n]) => n > 0)
      .sort((x, y) => y[1] - x[1])
      .map(([k, n]) =>
        `<span class="chip kill">${esc(labels[k] || k)} &times;${n}</span>`)
      .join("");
  }

  function popHTML(tieId, stage) {
    const m = byId[tieId];
    const t = (D.bracket || []).flatMap((r) => r.ties || [])
                .find((x) => x.id === tieId) || {};
    const a = t.a || (m && m.a) || "";
    const b = t.b || (m && m.b) || "";

    if (!m) {
      return `
        <div class="ph"><span class="st">${esc(stage)}</span>
          <span class="x">&times;</span></div>
        <div class="pb">
          <div class="vs">${esc(a)} <span class="dim">v</span> ${esc(b || "?")}</div>
          <div class="how">Not played yet. ${formatOf(stage)}.</div>
        </div>`;
    }

    const rows = (m.games || []).map((g) => {
      const sa = g.scores && (g.p1 === a ? g.scores.p1 : g.scores.p2);
      const sb = g.scores && (g.p1 === a ? g.scores.p2 : g.scores.p1);
      const link = g.session_id
        ? `<a href="${REPLAY}${esc(g.session_id)}" target="_blank">replay</a>`
        : `<span class="dim">&mdash;</span>`;
      const cards = g.cards
        ? ` &middot; <a href="${esc(g.cards)}" target="_blank">cards</a>` : "";
      const bad = g.error || g.aborted;
      return `<tr>
          <td>${g.n}</td>
          <td class="dim">${esc(g.p1 === a ? "p1" : "p2")}</td>
          <td class="${sa > sb ? "w" : ""}">${num(sa)}</td>
          <td class="${sb > sa ? "w" : ""}">${num(sb)}</td>
          <td class="dim">${g.seconds ? Math.round(g.seconds) + "s" : ""}</td>
          <td>${bad ? `<span class="red">${esc(String(bad).slice(0, 22))}</span>`
                    : link + cards}</td>
        </tr>`;
    }).join("");

    const aT = seatTotals(a, m.games);
    const bT = seatTotals(b, m.games);
    const aOrd = ordnanceChips(aT), bOrd = ordnanceChips(bT);
    const aKill = killChips(aT), bKill = killChips(bT);
    const shots = Object.values(aT.fired).concat(Object.values(bT.fired))
      .reduce((x, y) => x + y, 0);

    const line = (k, v) => v
      ? `<div class="line"><span class="k">${k}</span><span class="v">${v}</span></div>`
      : "";

    const head = m.complete
      ? `<span class="${m.winner === a ? "w" : ""}">${esc(a)}</span>
         <span class="dim">${esc(m.scoreline)}</span>
         <span class="${m.winner === b ? "w" : ""}">${esc(b)}</span>`
      : `${esc(a)} <span class="dim">v</span> ${esc(b)}`;

    const how = m.complete
      ? (m.decided_by === "wins"
          ? `Took it on season wins.`
          : m.decided_by === "margin"
            ? `Level on wins, decided on aggregate points (${
                m.margin > 0 ? "+" : ""}${m.margin} to ${esc(a)}).`
            : m.decided_by === "draw"
              ? `A genuine draw &mdash; level on wins and on aggregate.`
              : `Walkover.`)
      : ((m.games || []).length
          ? `In progress &mdash; ${plural(m.games.length, "season")} played.`
          : `Commissioned, not started. ${formatOf(stage)}.`);

    return `
      <div class="ph"><span class="st">${esc(stage)}</span>
        <span class="x">&times;</span></div>
      <div class="pb">
        <div class="vs">${head}</div>
        <div class="how">${how}</div>
        <table class="g">
          <thead><tr><th>#</th><th>Side</th><th>${esc(short(a, 12))}</th>
            <th>${esc(short(b, 12))}</th><th>Time</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="lines">
          ${line(esc(short(a, 13)) + " ordnance", aOrd)}
          ${line(esc(short(a, 13)) + " did", aKill)}
          ${line(esc(short(b, 13)) + " ordnance", bOrd)}
          ${line(esc(short(b, 13)) + " did", bKill)}
          ${(aOrd || bOrd) && !shots ? `<div class="line">
             <span class="k">note</span>
             <span class="v plain">Ordnance was bought and never fired &mdash;
               the buying half of the pipeline without the firing half.</span>
             </div>` : ""}
          ${(!aOrd && !bOrd) ? `<div class="line"><span class="k">weapons</span>
             <span class="v plain">Neither agent bought a charge in this tie.</span></div>` : ""}
        </div>
      </div>`;
  }

  function place(el) {
    const r = el.getBoundingClientRect();
    const w = pop.offsetWidth || 460;
    let left = r.right + 12 + window.scrollX;
    if (left + w > window.scrollX + window.innerWidth - 12) {
      left = Math.max(window.scrollX + 12, r.left - w - 12 + window.scrollX);
    }
    let top = r.top + window.scrollY - 8;
    const h = pop.offsetHeight || 300;
    const maxTop = window.scrollY + window.innerHeight - h - 12;
    if (top > maxTop) top = Math.max(window.scrollY + 12, maxTop);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function show(el) {
    pop.innerHTML = popHTML(el.dataset.tie, el.dataset.stage);
    pop.classList.add("on");
    place(el);
    const x = pop.querySelector(".x");
    if (x) x.addEventListener("click", hide);
  }

  function hide() {
    pop.classList.remove("on");
    if (pinned) { pinned.classList.remove("pinned"); pinned = null; }
  }

  document.querySelectorAll(".tie").forEach((el) => {
    el.addEventListener("mouseenter", () => { if (!pinned) show(el); });
    el.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (pinned === el) { hide(); return; }
      if (pinned) pinned.classList.remove("pinned");
      pinned = el;
      el.classList.add("pinned");
      show(el);
    });
  });

  document.querySelector(".bracket").addEventListener("mouseleave", () => {
    if (!pinned) pop.classList.remove("on");
  });
  document.addEventListener("click", (ev) => {
    if (pinned && !pop.contains(ev.target)) hide();
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") hide();
  });
})();
</script>

</body>
</html>
