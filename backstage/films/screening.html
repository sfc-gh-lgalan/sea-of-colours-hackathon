<!DOCTYPE html>
<!--
  Sea of Colours — screening room (v1.36).

  Every teaching film on one page, with the card text that ships beside
  it, so you can review the reels without playing three nights of two
  tutorials to see six of them.

  It reads `window.socTutorial.reels` out of the real tutorial.js rather
  than keeping its own list. That is the whole design: a screening room
  with a hand-copied index would drift from the reels within a week and
  then quietly review the wrong thing. If a reel names a film that is not
  on disk, or a film on disk is in no reel, this page says so — that is
  worth as much as the playback.

  Opens straight off disk, no server and no Python:

    open backstage/films/screening.html

  It lives here rather than under server/static/ because it is filming
  kit, not product — nothing the game serves refers to it, and an
  attendee should never find it. The cost is that it reaches sideways
  into server/static/ for the two things it cannot own: the reels, which
  are source, and the films, which are build output the game ships.
-->

<html lang="en">
<head>
<meta charset="utf-8">
<title>Sea of Colours — screening room</title>
<style>
  :root {
    --bg: #0d0d12;
    --panel: #14141c;
    --frame: #4a4a5a;
    --fg: #f0f6fc;
    --dim: #a8b1bd;
    --green: #4dca5e;
    --amber: #ffcc66;
    --red: #ff8585;
    --mono: 'JetBrains Mono', 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 var(--mono);
    display: grid; grid-template-columns: 310px 1fr; height: 100vh;
  }

  /* ── index ─────────────────────────────────────────────────────── */
  #index {
    border-right: 1px solid var(--frame); overflow-y: auto;
    background: var(--panel);
  }
  #index h1 {
    margin: 0; padding: 14px 16px 10px; font-size: 13px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--green);
    border-bottom: 1px solid var(--frame); position: sticky; top: 0;
    background: var(--panel); z-index: 2;
  }
  #index h1 small {
    display: block; color: var(--dim); letter-spacing: 1px;
    font-size: 10px; margin-top: 4px; text-transform: none;
  }
  .grp {
    padding: 12px 16px 4px; color: var(--amber); font-size: 10px;
    letter-spacing: 2px; text-transform: uppercase;
  }
  .turn {
    padding: 8px 16px 2px; color: var(--dim); font-size: 10px;
    letter-spacing: 1px;
  }
  .item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; border-left: 2px solid transparent;
    color: var(--fg); font: inherit; padding: 5px 16px 5px 22px;
  }
  .item:hover { background: #1d1d28; }
  .item.on { border-left-color: var(--green); background: #1a2a1c; }
  .item .nm { color: var(--dim); font-size: 10px; }
  .item.gone .nm, .item.gone { color: var(--red); }
  .item .len { float: right; color: var(--dim); font-size: 10px; }

  /* ── stage ─────────────────────────────────────────────────────── */
  #stage { overflow-y: auto; padding: 18px 24px 40px; }
  #bar {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    padding-bottom: 12px; border-bottom: 1px solid var(--frame);
    margin-bottom: 16px;
  }
  #bar button, #bar select {
    background: #1a1a24; color: var(--fg); border: 1px solid var(--frame);
    font: inherit; padding: 4px 10px; cursor: pointer;
  }
  #bar button:hover { border-color: var(--green); color: var(--green); }
  #bar label { color: var(--dim); display: flex; gap: 6px; align-items: center; }
  #pos { color: var(--dim); margin-left: auto; }

  video { width: 100%; background: #000; border: 1px solid var(--frame); display: block; }
  #missing {
    padding: 60px 20px; text-align: center; color: var(--red);
    border: 1px dashed var(--red); background: #1a1015;
  }

  #title { color: var(--green); font-size: 15px; margin: 16px 0 2px; }
  #where { color: var(--dim); font-size: 11px; margin-bottom: 14px; }
  #heading { color: var(--amber); margin: 0 0 8px; font-size: 13px; }
  #prose { max-width: 74ch; }
  #prose p { margin: 0 0 10px; color: #d6dde6; }
  #todo {
    max-width: 74ch; margin-top: 12px; padding: 8px 12px;
    border-left: 2px solid var(--green); background: #14200f; color: var(--green);
  }
  #todo b {
    display: block; font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--dim); margin-bottom: 3px;
  }
  #warn {
    margin-top: 22px; padding: 10px 12px; border: 1px solid var(--red);
    background: #1a1015; color: var(--red); max-width: 74ch; white-space: pre-wrap;
  }
  kbd {
    border: 1px solid var(--frame); border-bottom-width: 2px; padding: 0 4px;
    border-radius: 3px; color: var(--dim);
  }
</style>
</head>
<body>

<nav id="index"><h1>Screening room<small>every teaching film, with its card</small></h1></nav>

<main id="stage">
  <div id="bar">
    <button id="prev">&larr; prev</button>
    <button id="next">next &rarr;</button>
    <label><input type="checkbox" id="chain" checked> play through</label>
    <label><input type="checkbox" id="loop"> loop</label>
    <label>speed
      <select id="rate">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </label>
    <span id="pos"></span>
  </div>

  <div id="player"></div>
  <h2 id="title"></h2>
  <div id="where"></div>
  <h3 id="heading"></h3>
  <div id="prose"></div>
  <div id="todo" hidden><b>do this turn</b><span id="todotext"></span></div>
  <div id="warn" hidden></div>
  <p style="color:var(--dim);margin-top:26px">
    <kbd>&larr;</kbd> <kbd>&rarr;</kbd> prev / next &nbsp;·&nbsp;
    <kbd>space</kbd> play / pause &nbsp;·&nbsp; <kbd>r</kbd> replay
  </p>
</main>

<!-- The reels, from source. Never re-type this list here. -->
<script src="../../server/static/tutorial.js"></script>
<script>
(function () {
  "use strict";

  /* The films are build output the game ships, so they stay where the
   * game serves them from; this page reaches across to them. */
  var DIR = "../../server/static/films/";

  var REELS = (window.socTutorial && window.socTutorial.reels) || null;
  if (!REELS) {
    document.getElementById("stage").innerHTML =
      '<div id="missing">tutorial.js did not expose its reels, so there is ' +
      'nothing to screen. Check that server/static/tutorial.js still sets ' +
      'window.socTutorial.</div>';
    return;
  }

  /* Reel keys are `<preset>:<phase>:<day>`, and object order is the order
   * they are written in tutorial.js, which is already play order. Trust
   * that rather than re-deriving it — the reels are the script. */
  var shots = [];
  Object.keys(REELS).forEach(function (key) {
    var reel = REELS[key];
    var bits = key.split(":");
    (reel.chapters || []).forEach(function (ch, i) {
      shots.push({
        key: key, preset: bits[0], phase: bits[1], day: bits[2],
        title: reel.title, n: i + 1, of: reel.chapters.length,
        heading: ch.heading || "", body: ch.body || "",
        todo: ch.todo || "", film: ch.film || "",
      });
    });
  });

  var el = {};
  ["index", "player", "title", "where", "heading", "prose", "todo",
   "todotext", "warn", "pos", "prev", "next", "chain", "loop", "rate"]
    .forEach(function (id) { el[id] = document.getElementById(id); });

  /* ── index ─────────────────────────────────────────────────────── */
  var buttons = [];
  var lastPreset = null, lastKey = null;

  shots.forEach(function (s, i) {
    if (s.preset !== lastPreset) {
      var g = document.createElement("div");
      g.className = "grp";
      g.textContent = s.preset;
      el.index.appendChild(g);
      lastPreset = s.preset;
      lastKey = null;
    }
    if (s.key !== lastKey) {
      var t = document.createElement("div");
      t.className = "turn";
      t.textContent = s.phase + " · day " + s.day;
      el.index.appendChild(t);
      lastKey = s.key;
    }
    var b = document.createElement("button");
    b.className = "item";
    b.innerHTML = '<span class="len" data-len></span>' +
                  '<span data-hd></span><br><span class="nm"></span>';
    b.querySelector("[data-hd]").textContent = s.heading;
    b.querySelector(".nm").textContent = s.film || "(no film)";
    b.addEventListener("click", function () { show(i); });
    el.index.appendChild(b);
    buttons.push(b);
  });

  /* A reel can name a film that was never shot; the modal degrades to a
   * placeholder and says nothing. Here that is the point of the page, so
   * probe each one and mark it. */
  shots.forEach(function (s, i) {
    if (!s.film) { buttons[i].classList.add("gone"); return; }
    var v = document.createElement("video");
    v.preload = "metadata";
    v.addEventListener("loadedmetadata", function () {
      s.secs = v.duration;
      buttons[i].querySelector("[data-len]").textContent = fmt(v.duration);
    });
    v.addEventListener("error", function () {
      s.gone = true;
      buttons[i].classList.add("gone");
    });
    v.src = DIR + s.film;
  });

  function fmt(secs) {
    if (!isFinite(secs)) return "";
    var m = Math.floor(secs / 60), s = Math.round(secs % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  /* ── stage ─────────────────────────────────────────────────────── */
  var at = -1, vid = null;

  function show(i) {
    if (i < 0 || i >= shots.length) return;
    at = i;
    var s = shots[i];

    buttons.forEach(function (b, j) { b.classList.toggle("on", j === i); });
    buttons[i].scrollIntoView({ block: "nearest" });

    el.title.textContent = s.title;
    el.where.textContent = s.preset + " · " + s.phase + " · day " + s.day +
      "   ·   chapter " + s.n + " of " + s.of +
      (s.film ? "   ·   " + s.film : "");
    el.heading.textContent = s.heading;
    el.pos.textContent = (i + 1) + " / " + shots.length;

    el.prose.textContent = "";
    s.body.split("\n\n").forEach(function (para) {
      var p = document.createElement("p");
      p.textContent = para;
      el.prose.appendChild(p);
    });
    el.todotext.textContent = s.todo;
    el.todo.hidden = !s.todo;

    el.player.textContent = "";
    vid = null;
    if (!s.film) {
      el.player.innerHTML =
        '<div id="missing">This chapter is prose only — no film is named ' +
        'for it in tutorial.js.</div>';
    } else {
      vid = document.createElement("video");
      vid.controls = true;
      vid.autoplay = true;
      vid.loop = el.loop.checked;
      vid.playbackRate = parseFloat(el.rate.value);
      vid.src = DIR + s.film;
      vid.addEventListener("ended", function () {
        if (el.chain.checked && !el.loop.checked) show(at + 1);
      });
      vid.addEventListener("error", function () {
        el.player.innerHTML =
          '<div id="missing">' + s.film + ' is named by this reel ' +
          'and is not on disk. Re-shoot it:<br><br>' +
          'python backstage/films/make_tutorial_films.py --only ' +
          s.film.replace(/\.webm$/, "") + '</div>';
      });
      el.player.appendChild(vid);
    }
  }

  el.prev.addEventListener("click", function () { show(at - 1); });
  el.next.addEventListener("click", function () { show(at + 1); });
  el.rate.addEventListener("change", function () {
    if (vid) vid.playbackRate = parseFloat(el.rate.value);
  });
  el.loop.addEventListener("change", function () {
    if (vid) vid.loop = el.loop.checked;
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.target instanceof HTMLInputElement ||
        ev.target instanceof HTMLSelectElement) return;
    if (ev.key === "ArrowRight") { show(at + 1); }
    else if (ev.key === "ArrowLeft") { show(at - 1); }
    else if (ev.key === "r" && vid) { vid.currentTime = 0; vid.play(); }
    else if (ev.key === " " && vid) {
      ev.preventDefault();
      if (vid.paused) { vid.play(); } else { vid.pause(); }
    }
  });

  /* ── the check that earns the page its keep ────────────────────── */
  var named = shots.map(function (s) { return s.film; }).filter(Boolean);
  var KNOWN = [
    "basic_probe", "basic_praxis", "basic_orbit_probes", "basic_drop",
    "basic_stranded", "basic_score", "basic_buy_harvester", "basic_crash",
    "basic_supersede", "adv_hotdrop", "adv_buy_emp", "adv_redsign",
    "adv_redsign_rival", "adv_buy_chaff", "adv_emp", "adv_chaff",
  ];
  var orphans = KNOWN.filter(function (n) {
    return named.indexOf(n + ".webm") === -1;
  });
  if (orphans.length) {
    el.warn.hidden = false;
    el.warn.textContent =
      "Shot but shown to nobody: " + orphans.join(", ") +
      "\nThese films exist in make_tutorial_films.py and no reel in " +
      "tutorial.js names them, so no player will ever see them.";
  }

  show(0);
})();
</script>
</body>
</html>
